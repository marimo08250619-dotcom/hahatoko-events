<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イベント お申し込み</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
  :root {
    --cream:#FFFFFF; --cream-2:#F7F7F7; --terracotta:#D9909C; --terracotta-dark:#C76F7E;
    --sage:#7A9E87; --sage-dark:#5A8060; --ink:#4A4038;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; color-scheme: light; padding:24px 16px 60px; }
  .wrap { max-width:560px; margin:0 auto; }
  header { text-align:center; margin-bottom:28px; }
  header .eyebrow { font-size:13px; letter-spacing:.15em; color:var(--terracotta-dark); font-weight:500; }
  header h1 { font-family:'Shippori Mincho',serif; font-size:26px; margin:6px 0 10px; }
  header p { font-size:14px; line-height:1.8; color:#6b5f54; margin:0; white-space:pre-line; }
  .card { background:#fff; border-radius:18px; padding:26px 22px; box-shadow:0 4px 20px rgba(0,0,0,.06); border:1px solid #EFE6DA; margin-bottom:16px; }
  .event-box { background:var(--cream-2); border-radius:12px; padding:14px 16px; margin-bottom:22px; font-size:14px; line-height:1.9; }
  .event-box b { color:var(--terracotta-dark); }
  label { display:block; font-size:13px; font-weight:500; margin:18px 0 6px; }
  label:first-child { margin-top:0; }
  label .req { color:var(--terracotta); margin-left:4px; }
  input[type=text], textarea { width:100%; padding:11px 12px; border-radius:10px; border:1px solid #E3D8C8; background:var(--cream-2); font-family:inherit; font-size:15px; color:var(--ink); }
  textarea { resize:vertical; min-height:70px; }
  input:focus, textarea:focus { outline:none; border-color:var(--sage); background:#fff; }
  .time-options { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .time-option { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:1px solid #E3D8C8; background:var(--cream-2); font-size:14px; cursor:pointer; }
  .time-option input { width:auto; }
  button.submit { width:100%; margin-top:26px; padding:14px; border:none; border-radius:12px; background:var(--terracotta); color:#fff; font-size:15px; font-weight:700; letter-spacing:.05em; cursor:pointer; }
  button.submit:disabled { background:#D9C9BE; cursor:not-allowed; }
  .success { text-align:center; padding:40px 10px; }
  .success .mark { font-size:40px; color:var(--sage-dark); margin-bottom:10px; }
  .success h2 { font-family:'Shippori Mincho',serif; font-size:20px; margin:4px 0 10px; }
  .success p { font-size:14px; color:#6b5f54; line-height:1.8; white-space:pre-line; }
  .error-msg { color:var(--terracotta-dark); font-size:13px; margin-top:8px; display:none; }
  .back-link { font-size:12px; color:#b6a998; text-decoration:underline; background:none; border:none; cursor:pointer; margin-top:14px; }
  .picker-item { display:block; width:100%; text-align:left; padding:16px; border-radius:12px; border:1px solid #EFE6DA; background:var(--cream-2); margin-bottom:10px; cursor:pointer; }
  .picker-item .name { font-family:'Shippori Mincho',serif; font-size:17px; }
  .picker-item .meta { font-size:13px; color:#6b5f54; margin-top:4px; }
  .empty-note, .loading-note { text-align:center; color:#8a7c6c; font-size:13px; padding:30px 10px; }
  .screen { display:none; }
  .screen.active { display:block; }
</style>
</head>
<body>
<div class="wrap">

  <div id="pickerScreen" class="screen active">
    <header>
      <div class="eyebrow">お申し込み受付中のイベント</div>
      <h1>イベントを選んでください</h1>
    </header>
    <div id="pickerList" class="loading-note">読み込み中...</div>
  </div>

  <div id="formScreen" class="screen">
    <header>
      <div class="eyebrow" id="eyebrowEl"></div>
      <h1 id="titleEl"></h1>
      <p id="introEl"></p>
    </header>
    <div class="card">
      <div class="event-box">
        <div><b>日程</b>：<span id="dateLineEl"></span></div>
        <div><b>会場</b>：<span id="venueLineEl"></span></div>
      </div>
      <form id="entryForm">
        <label>お名前<span class="req">必須</span></label>
        <input type="text" id="name" required placeholder="例）山田 花子">
        <label>ご連絡先(電話番号 または LINE ID)<span class="req">必須</span></label>
        <input type="text" id="contact" required placeholder="例）090-xxxx-xxxx">
        <label>ご希望の時間帯<span class="req">必須</span></label>
        <div class="time-options" id="timeOptionsEl"></div>
        <label>ご相談内容・お身体の気になる点(任意)</label>
        <textarea id="note" placeholder="例）産後の骨盤まわり、古傷のケアについて相談したい　など"></textarea>
